[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truckmaps-backend"
version = "0.1.0"
description = "Rdzeń TruckMaps: API, SDK modułów, routing dla ciężarówek"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "packaging>=24",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "import-linter>=2.1",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/truckmaps"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

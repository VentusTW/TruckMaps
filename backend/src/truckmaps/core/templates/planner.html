<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planer trasy – TruckMaps</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --bg:#f6f5f1; --card:#fff; --text:#1f1e1c; --muted:#5f5e5a; --border:#d3d1c7;
          --accent:#185fa5; --on-accent:#fff; --ok:#3b6d11; --bad:#a32d2d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1c1a; --card:#2c2c2a; --text:#f1efe8; --muted:#b4b2a9; --border:#444441;
            --accent:#85b7eb; --on-accent:#042c53; --ok:#97c459; --bad:#f09595; }
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:grid; grid-template-columns:340px 1fr;
         background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  aside { overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;
          border-right:1px solid var(--border); background:var(--card); }
  #map { height:100vh; }
  h1 { font-size:18px; margin:0; display:flex; justify-content:space-between; align-items:center; }
  h1 a { font-size:13px; font-weight:400; color:var(--accent); }
  h2 { font-size:14px; margin:8px 0 0; color:var(--muted); font-weight:600; }
  label { display:grid; grid-template-columns:1fr 96px; align-items:center; gap:8px; font-size:14px; }
  input, select { font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--border);
                  background:var(--bg); color:var(--text); width:100%; }
  .row { display:flex; gap:8px; }
  button { font:inherit; padding:9px 12px; border-radius:10px; border:1px solid var(--border);
           background:transparent; color:var(--text); cursor:pointer; flex:1; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .muted { color:var(--muted); font-size:13px; margin:0; }
  .result { padding:12px; border-radius:10px; border:1px solid var(--ok); }
  .result strong { font-size:20px; }
  .error { padding:10px 12px; border-radius:10px; border:1px solid var(--bad); color:var(--bad); font-size:14px; }
  [hidden] { display:none !important; }
  @media (max-width: 700px) {
    body { grid-template-columns:1fr; grid-template-rows:auto 60vh; height:auto; }
    aside { border-right:none; } #map { height:60vh; }
  }
</style>
</head>
<body>
<aside>
  <h1>Planer trasy <a href="/">← Konto</a></h1>

  <h2>Pojazd</h2>
  <select id="vehicle-select" aria-label="Wybierz pojazd"></select>
  <form id="vehicle-form">
    <label>Nazwa <input name="name" required maxlength="100" style="grid-column:2"></label>
    <label>Wysokość [m] <input name="height_m" type="number" step="0.05" min="1.5" max="6" required></label>
    <label>Szerokość [m] <input name="width_m" type="number" step="0.05" min="1.5" max="4.5" required></label>
    <label>Długość [m] <input name="length_m" type="number" step="0.1" min="3" max="40" required></label>
    <label>Masa [t] <input name="weight_t" type="number" step="0.5" min="3.5" max="150" required></label>
    <label>Nacisk osi [t] <input name="axle_load_t" type="number" step="0.5" min="1" max="20" required></label>
    <label>Liczba osi <input name="axle_count" type="number" step="1" min="2" max="20" required></label>
    <label>Naczepa
      <select name="trailer_type">
        <option value="curtain">plandeka</option><option value="box">kontener / izoterma</option>
        <option value="reefer">chłodnia</option><option value="tanker">cysterna</option>
        <option value="flatbed">platforma</option><option value="container">kontener</option>
        <option value="lowloader">niskopodwoziowa</option><option value="none">brak (solówka)</option>
      </select>
    </label>
    <label>ADR <input name="hazmat" type="checkbox" style="width:auto;justify-self:start"></label>
    <div class="row" style="margin-top:8px">
      <button type="submit" class="primary" id="save">Zapisz pojazd</button>
      <button type="button" id="new">Nowy</button>
    </div>
  </form>
  <div class="row">
    <button type="button" data-preset="truck">+ Zestaw 40 t</button>
    <button type="button" data-preset="solo">+ Solówka 12 t</button>
  </div>

  <h2>Trasa</h2>
  <p class="muted" id="hint">Kliknij na mapie punkt startu (A), potem cel (B).</p>
  <div class="row">
    <button type="button" class="primary" id="calc">Wyznacz trasę</button>
    <button type="button" id="demo">Poznań → Warszawa</button>
  </div>
  <div class="result" id="result" hidden></div>
  <div class="error" id="error" hidden></div>
</aside>
<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const TOKEN = __ACCESS_TOKEN__;
const PRESETS = {
  truck: { name: "Zestaw 40 t", height_m: 4.0, width_m: 2.55, length_m: 16.5, weight_t: 40,
           axle_load_t: 11.5, axle_count: 5, trailer_type: "curtain", hazmat: false },
  solo: { name: "Solówka 12 t", height_m: 3.5, width_m: 2.55, length_m: 9.5, weight_t: 12,
          axle_load_t: 8, axle_count: 2, trailer_type: "none", hazmat: false },
};
const $ = (id) => document.getElementById(id);
const escapeHtml = (text) => String(text).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const form = $("vehicle-form");
let vehicles = [];
let points = [];
let markers = [];

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { "Authorization": `Bearer ${TOKEN}`, "Content-Type": "application/json" },
  });
  if (response.status === 401) { location.href = "/"; return; }
  const body = response.status === 204 ? null : await response.json();
  if (!response.ok) throw new Error(typeof body?.detail === "string" ? body.detail : "Nieprawidłowe dane pojazdu.");
  return body;
}

function showError(message) { $("error").textContent = message; $("error").hidden = !message; }

function fillForm(vehicle) {
  for (const element of form.elements) {
    if (!element.name) continue;
    if (element.type === "checkbox") element.checked = Boolean(vehicle?.[element.name]);
    else element.value = vehicle?.[element.name] ?? "";
  }
}

function readForm() {
  const data = {};
  for (const element of form.elements) {
    if (!element.name) continue;
    data[element.name] = element.type === "checkbox" ? element.checked
      : element.type === "number" ? Number(element.value) : element.value;
  }
  return data;
}

async function loadVehicles(selectId) {
  vehicles = await api("/api/vehicles");
  const select = $("vehicle-select");
  select.innerHTML = vehicles.length
    ? vehicles.map((v) => `<option value="${escapeHtml(v.id)}">${escapeHtml(v.name)} –${v.height_m} m, ${v.weight_t} t</option>`).join("")
    : '<option value="">Brak pojazdów – dodaj pierwszy</option>';
  if (selectId) select.value = selectId;
  fillForm(vehicles.find((v) => v.id === select.value) ?? PRESETS.truck);
}

async function saveVehicle(data) {
  const id = $("vehicle-select").value;
  const saved = id
    ? await api(`/api/vehicles/${id}`, { method: "PUT", body: JSON.stringify(data) })
    : await api("/api/vehicles", { method: "POST", body: JSON.stringify(data) });
  await loadVehicles(saved.id);
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  try { showError(""); await saveVehicle(readForm()); } catch (e) { showError(e.message); }
});
$("new").addEventListener("click", () => { $("vehicle-select").value = ""; fillForm(PRESETS.truck); });
$("vehicle-select").addEventListener("change", (event) =>
  fillForm(vehicles.find((v) => v.id === event.target.value)));
document.querySelectorAll("[data-preset]").forEach((button) =>
  button.addEventListener("click", async () => {
    try {
      showError("");
      const saved = await api("/api/vehicles", { method: "POST", body: JSON.stringify(PRESETS[button.dataset.preset]) });
      await loadVehicles(saved.id);
    } catch (e) { showError(e.message); }
  }));

const map = new maplibregl.Map({
  container: "map",
  center: [19.1, 52.1],
  zoom: 5.6,
  style: {
    version: 8,
    sources: {
      osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256,
             attribution: "© współtwórcy OpenStreetMap" },
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }],
  },
});

function setPoint(lngLat) {
  if (points.length === 2) { points = []; markers.forEach((m) => m.remove()); markers = []; clearRoute(); }
  points.push(lngLat);
  const label = points.length === 1 ? "A" : "B";
  const element = document.createElement("div");
  element.textContent = label;
  element.style.cssText = "width:26px;height:26px;border-radius:50%;display:grid;place-items:center;" +
    "font:600 13px system-ui;color:#fff;border:2px solid #fff;background:" + (label === "A" ? "#185fa5" : "#a32d2d");
  markers.push(new maplibregl.Marker({ element }).setLngLat(lngLat).addTo(map));
  $("hint").textContent = points.length === 1 ? "Teraz kliknij cel (B)." : "Gotowe – wyznacz trasę. Kolejne kliknięcie zaczyna od nowa.";
}

function clearRoute() {
  if (map.getSource("route")) map.getSource("route").setData({ type: "FeatureCollection", features: [] });
  $("result").hidden = true;
}

map.on("click", (event) => setPoint(event.lngLat));
map.on("load", () => {
  map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "route-casing", type: "line", source: "route",
                 paint: { "line-color": "#ffffff", "line-width": 9 }, layout: { "line-cap": "round", "line-join": "round" } });
  map.addLayer({ id: "route", type: "line", source: "route",
                 paint: { "line-color": "#3b6d11", "line-width": 5 }, layout: { "line-cap": "round", "line-join": "round" } });
});

$("demo").addEventListener("click", () => {
  points = []; markers.forEach((m) => m.remove()); markers = []; clearRoute();
  setPoint({ lng: 16.9252, lat: 52.4064 });
  setPoint({ lng: 21.0122, lat: 52.2297 });
  calculate();
});
$("calc").addEventListener("click", calculate);

async function calculate() {
  showError("");
  const vehicleId = $("vehicle-select").value;
  if (!vehicleId) return showError("Najpierw zapisz pojazd.");
  if (points.length < 2) return showError("Zaznacz na mapie start (A) i cel (B).");
  $("calc").disabled = true;
  try {
    const route = await api("/api/routes", { method: "POST", body: JSON.stringify({
      origin: { lat: points[0].lat, lon: points[0].lng },
      destination: { lat: points[1].lat, lon: points[1].lng },
      vehicle_id: vehicleId,
    }) });
    map.getSource("route").setData({ type: "Feature", geometry: { type: "LineString", coordinates: route.geometry } });
    const bounds = route.geometry.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(route.geometry[0], route.geometry[0]));
    map.fitBounds(bounds, { padding: 60 });
    const hours = Math.floor(route.duration_min / 60), minutes = Math.round(route.duration_min % 60);
    $("result").innerHTML = `<strong>${route.distance_km.toLocaleString("pl-PL")} km</strong> · ${hours} h ${minutes} min` +
      `<p class="muted">Dla: ${escapeHtml(route.vehicle.name)} (${route.vehicle.height_m} m, ${route.vehicle.weight_t} t). ` +
      `Kolory ryzyka (żółty, czerwony) dojdą w kolejnym etapie.</p>`;
    $("result").hidden = false;
  } catch (e) {
    showError(e.message);
  } finally {
    $("calc").disabled = false;
  }
}

loadVehicles().catch((e) => showError(e.message));
</script>
</body>
</html>

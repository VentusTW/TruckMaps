[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truckmaps-module-documents"
version = "0.1.0"
description = "Moduł Dokumenty TruckMaps – CMR, zlecenie transportowe, karta drogowa: szablony, autouzupełnianie, PDF"
requires-python = ">=3.12"
dependencies = ["truckmaps-backend>=0.1,<1.0", "pillow>=10"]

# Nazwa entry pointu musi być równa Module.id.
[project.entry-points."truckmaps.modules"]
documents = "truckmaps_documents.module:DocumentsModule"

[tool.hatch.build.targets.wheel]
packages = ["src/truckmaps_documents"]

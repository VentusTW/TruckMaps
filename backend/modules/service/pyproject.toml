[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truckmaps-module-service"
version = "0.1.0"
description = "Moduł Serwis TruckMaps – zgłoszenia usterek, zlecenia i protokoły napraw"
requires-python = ">=3.12"
dependencies = ["truckmaps-backend>=0.1,<1.0"]

# Nazwa entry pointu musi być równa Module.id.
[project.entry-points."truckmaps.modules"]
service = "truckmaps_service.module:ServiceModule"

[tool.hatch.build.targets.wheel]
packages = ["src/truckmaps_service"]

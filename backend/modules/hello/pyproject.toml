[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truckmaps-module-hello"
version = "0.1.0"
description = "Moduł testowy TruckMaps – wzorzec dla kolejnych modułów"
requires-python = ">=3.12"
dependencies = ["truckmaps-backend>=0.1,<1.0"]

# Nazwa entry pointu musi być równa Module.id.
[project.entry-points."truckmaps.modules"]
hello = "truckmaps_hello.module:HelloModule"

[tool.hatch.build.targets.wheel]
packages = ["src/truckmaps_hello"]

# Migracje bazy rdzenia. Uruchomienie z katalogu głównego repozytorium:
#   .venv\Scripts\alembic -c backend\alembic.ini upgrade head
# Adres bazy: TRUCKMAPS_DATABASE_URL (zmienna środowiskowa albo plik .env).

[alembic]
script_location = %(here)s/migrations
# Migracje rdzenia i modułów (każdy moduł z tabelami – osobna gałąź, np. „service”).
# Z wieloma gałęziami: `alembic ... upgrade heads`.
version_locations = %(here)s/migrations/versions %(here)s/modules/service/migrations
path_separator = space
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

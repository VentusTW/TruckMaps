<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="plans.driver.title">TruckMaps</title>
  <meta name="description" content="" data-i18n-attr="content:plans.driver.lead">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-head">
      <div class="container center">
        <div class="breadcrumbs"><a href="index.html" data-i18n="nav.home"></a> / <a href="cennik.html" data-i18n="nav.pricing"></a></div>
        <h1 data-i18n="groups.driver.name"></h1>
        <p class="lead" data-i18n="plans.driver.lead"></p>
        <div class="toggle" role="group" data-i18n-attr="aria-label:pricing.billingChoose" data-billing-toggle></div>
      </div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="plans" data-plans="driver"></div>
        <p class="small muted center" style="margin-top:20px" data-i18n="meta.vatNote"></p>
      </div>
    </section>
    <section class="section" style="padding-top:0">
      <div class="container" style="max-width:880px">
        <h2 class="center" data-i18n="addons.title"></h2>
        <p class="center muted" data-i18n="addons.lead"></p>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th data-i18n="addons.thAddon"></th><th data-i18n="addons.thPrice"></th></tr></thead>
            <tbody data-addons></tbody>
          </table>
        </div>
        <p class="small muted" style="margin-top:10px" data-addons-billing></p>
        <p class="info small" data-addons-note></p>
      </div>
    </section>
    <section class="section alt">
      <div class="container prose" style="margin:0 auto">
        <h2 class="center" data-i18n="pricing.faqTitle"></h2>
        <div data-i18n-faq="pricing.faq"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="assets/js/i18n-pl.js"></script>
  <script src="assets/js/i18n-en.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pricing.js"></script>
</body>
</html>

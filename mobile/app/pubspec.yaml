name: truckmaps_app
description: "TruckMaps – powłoka aplikacji (rdzeń) z modułami."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Daty, liczby i waluty według języka (wersję wyznacza flutter_localizations).
  intl: any
  http: ^1.2.1
  url_launcher: ^6.2.5
  # Sesja (token odświeżania) w magazynie systemu: Menedżer poświadczeń / Keystore / Keychain.
  flutter_secure_storage: ^9.0.0
  # Mapa: kafelki OSM jak w planerze w przeglądarce; działa także na Windows.
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  # Nawigacja: pozycja GPS i dźwięk alarmu czerwonego.
  geolocator: ^11.0.0
  audioplayers: ^5.2.1
  core_sdk:
    path: ../packages/core_sdk
  app_auth:
    path: ../packages/app_auth
  # Pakiety modułów wbudowane w aplikację; dostęp do nich sprawdza serwer.
  module_hello:
    path: ../packages/module_hello
  module_service:
    path: ../packages/module_service
  module_load:
    path: ../packages/module_load
  module_drivers:
    path: ../packages/module_drivers
  module_documents:
    path: ../packages/module_documents
  image_picker: ^1.1.2
  mobile_scanner: ^5.1.1
  google_mlkit_text_recognition: ^0.15.0
  vector_map_tiles: ^7.3.1
  vector_map_tiles_pmtiles: ^1.3.0
  vector_tile_renderer: 5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Teksty w wielu językach z lib/l10n (l10n.yaml).
  generate: true
  assets:
    - assets/alarm.wav
